name: Publish Cyberdeck release

on:
  repository_dispatch:
    types:
      - cyberdeck_release
  workflow_dispatch:
    inputs:
      version:
        description: Cyberdeck version without the v prefix
        required: true
        type: string
      tag:
        description: Cyberdeck release tag
        required: true
        type: string
      source_url:
        description: Published source distribution URL
        required: true
        type: string
      source_sha256:
        description: Published source distribution SHA-256
        required: true
        type: string
      macos_arm64_url:
        description: Published standalone Apple Silicon bundle URL
        required: true
        type: string
      macos_arm64_sha256:
        description: Published standalone Apple Silicon bundle SHA-256
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cyberdeck-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  update-homebrew:
    name: Update standalone formula through protected PR
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      SOURCE_URL: ${{ github.event.client_payload.source_url || inputs.source_url }}
      SOURCE_SHA256: ${{ github.event.client_payload.source_sha256 || inputs.source_sha256 }}
      MACOS_ARM64_URL: ${{ github.event.client_payload.macos_arm64_url || inputs.macos_arm64_url }}
      MACOS_ARM64_SHA256: ${{ github.event.client_payload.macos_arm64_sha256 || inputs.macos_arm64_sha256 }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Prepare idempotent release branch
        run: |
          BRANCH="release/cyberdeck-$VERSION"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git switch --track "origin/$BRANCH"
          else
            git switch --create "$BRANCH"
          fi

      - name: Validate release payload and artifact
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$RELEASE_TAG" = "v$VERSION"
          [[ "$SOURCE_URL" == "https://github.com/jessecanderson/cyberdeck/releases/download/$RELEASE_TAG/"* ]]
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MACOS_ARM64_URL" == "https://github.com/jessecanderson/cyberdeck/releases/download/$RELEASE_TAG/"* ]]
          [[ "$MACOS_ARM64_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --silent --show-error "$SOURCE_URL" --output "$RUNNER_TEMP/cyberdeck.tar.gz"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/cyberdeck.tar.gz" | sha256sum --check
          curl --fail --location --silent --show-error "$MACOS_ARM64_URL" --output "$RUNNER_TEMP/cyberdeck-macos-arm64.tar.gz"
          echo "$MACOS_ARM64_SHA256  $RUNNER_TEMP/cyberdeck-macos-arm64.tar.gz" | sha256sum --check

      - name: Update formula
        env:
          FORMULA_PATH: Formula/cyberdeck.rb
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["FORMULA_PATH"])
          text = path.read_text()
          text, url_count = re.subn(
              r'^  url "https://github\.com/jessecanderson/cyberdeck/releases/download/[^\"]+"$',
              f'  url "{os.environ["MACOS_ARM64_URL"]}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text, sha_count = re.subn(
              r'^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{os.environ["MACOS_ARM64_SHA256"]}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if (url_count, sha_count) != (1, 1):
              raise SystemExit("Cyberdeck formula URL or checksum was not uniquely replaceable")
          text = re.sub(r'^  revision \d+\n', '', text, count=1, flags=re.MULTILINE)
          path.write_text(text)
          PY

      - name: Open Homebrew pull request
        id: pull-request
        run: |
          BRANCH="release/cyberdeck-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cyberdeck.rb
          if git diff --cached --quiet; then
            echo "Formula already targets Cyberdeck $VERSION"
            exit 0
          fi
          git commit -m "cyberdeck $VERSION"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "cyberdeck $VERSION" \
              --body "Automated standalone Apple Silicon formula update for Cyberdeck $RELEASE_TAG. Published source and standalone archive checksums were verified before this PR was created.")
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr merge "$PR_URL" --auto --squash --delete-branch

      - name: Report pull request
        if: steps.pull-request.outputs.url
        run: echo "Homebrew update queued at ${{ steps.pull-request.outputs.url }}"
