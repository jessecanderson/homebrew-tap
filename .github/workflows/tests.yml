name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      # test-bot may report a formula build failure as a warning while returning
      # success. Exercise the public install path explicitly so branch protection
      # cannot merge a release formula that did not install.
      - name: Install and test Cyberdeck formula
        if: github.event_name == 'pull_request' && hashFiles('Formula/cyberdeck.rb') != ''
        run: |
          brew uninstall --formula cyberdeck || true
          brew install --formula cyberdeck
          brew test cyberdeck
          cyberdeck --version

      - name: Audit and install Apple Silicon cask
        if: github.event_name == 'pull_request' && matrix.os == 'macos-26' && hashFiles('Casks/cyberdeck.rb') != ''
        run: |
          brew audit --cask --strict cyberdeck
          brew uninstall --formula cyberdeck || true
          brew install --cask cyberdeck
          cyberdeck --version

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
